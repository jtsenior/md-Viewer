name: md_viewer
description: A macOS Markdown file viewer built with Flutter.
version: 1.0.0+1
license: Apache-2.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.3
  file_picker: ^8.0.0
  shared_preferences: ^2.2.2
  path: ^1.9.0
  google_fonts: ^6.2.1
  url_launcher: ^6.2.4
  webview_flutter: ^4.10.0
  markdown: ^7.3.1
  pdf: ^3.11.0
  archive: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
